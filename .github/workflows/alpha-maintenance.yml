name: One-shot alpha verification

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  maintenance:
    if: >-
      github.repository == 'd-sandhu/screenfling' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'alpha/macos-hardening-2026-09-13'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Apply exact documentation and recovery corrections
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 tools/alpha-refresh.py
          npm run format
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src tools/acceptance .github/workflows/alpha-maintenance.yml
          git commit -m 'fix: clarify uncertain outcomes and verify packaged ACL boundary'
          git add -- README.md ROADMAP.md CONTRIBUTING.md docs
          git commit -m 'docs: reconcile alpha gates with current implementation and evidence'
          test -z "$(git status --porcelain)"
          actual=$(git ls-remote origin refs/heads/alpha/macos-hardening-2026-09-13 | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/alpha/macos-hardening-2026-09-13
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run package:mac
      - run: npx playwright install chromium
      - run: node --test tools/acceptance/ui.test.cjs
      - run: node tools/acceptance/lifecycle.cjs
