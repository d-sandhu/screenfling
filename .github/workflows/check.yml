name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm install --global npm@11.19.0
      - run: npm --version
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - if: runner.os == 'macOS'
        # package:mac fixes identity to '-'. Never provide certificates or secrets here.
        env:
          CSC_FOR_PULL_REQUEST: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac
      - name: Verify local ad-hoc macOS signatures (not signing trust or notarization)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="release/$(node -p 'process.arch === "arm64" ? "mac-arm64" : "mac"')/ScreenFling.app"
          /usr/bin/codesign --verify --deep --strict "$APP"
          /usr/bin/codesign --verify --strict "$APP/Contents/Resources/screenfling-selector-acl"
          SIGNATURE="$(/usr/bin/codesign --display --verbose=2 "$APP" 2>&1)"
          grep -qx 'Signature=adhoc' <<< "$SIGNATURE"
          echo 'Ad-hoc bundle and helper signature verification passed. No Developer ID or notarization claim.'
      - if: runner.os == 'Windows'
        run: npm run package:win
      - run: npx playwright install chromium
      - name: Built renderer fixture acceptance (not native capture)
        run: node --test tools/acceptance/ui.test.cjs
      - name: Packaged macOS lifecycle acceptance (no capture or permission changes)
        if: runner.os == 'macOS'
        run: node tools/acceptance/lifecycle.cjs
