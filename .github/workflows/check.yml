name: Check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm install --global npm@11.19.0
      - run: npm ci --no-audit
      - run: npm audit --audit-level=high
      - name: Prepare pinned headless WezTerm fixture (no installation or GUI)
        if: runner.os == 'macOS'
        run: node tools/acceptance/prepare-wezterm.cjs
      - run: npm run check
      - run: npm run build
      - if: runner.os == 'macOS' && (github.event_name == 'push' || startsWith(github.head_ref, 'release/'))
        # package:mac fixes identity to '-'. Never provide certificates or secrets here.
        env:
          CSC_FOR_PULL_REQUEST: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --no-install electron-builder --publish never --dir --mac --config.mac.identity=- --config.mac.hardenedRuntime=false
      - name: Verify local ad-hoc macOS signatures (not signing trust or notarization)
        if: runner.os == 'macOS' && (github.event_name == 'push' || startsWith(github.head_ref, 'release/'))
        shell: bash
        run: |
          APP="release/$(node -p 'process.arch === "arm64" ? "mac-arm64" : "mac"')/ScreenFling.app"
          /usr/bin/codesign --verify --deep --strict "$APP"
          /usr/bin/codesign --verify --strict "$APP/Contents/Resources/screenfling-selector-acl"
          SIGNATURE="$(/usr/bin/codesign --display --verbose=2 "$APP" 2>&1)"
          grep -qx 'Signature=adhoc' <<< "$SIGNATURE"
          echo 'Ad-hoc bundle and helper signature verification passed. No Developer ID or notarization claim.'
      - if: runner.os == 'Windows' && (github.event_name == 'push' || startsWith(github.head_ref, 'release/'))
        run: npx --no-install electron-builder --publish never --dir --win --x64
      - run: npx --no-install playwright install chromium --only-shell
      - name: Built renderer fixture acceptance (not native capture)
        run: node --test tools/acceptance/ui.test.cjs
      - name: Packaged macOS functional acceptance and timing observation
        if: runner.os == 'macOS' && (github.event_name == 'push' || startsWith(github.head_ref, 'release/'))
        shell: bash
        run: |
          node tools/acceptance/lifecycle.cjs --capture-workflow
          node tools/acceptance/codex-attachment.cjs | tee release/agent-observation.json
          # Shared hosted runners are not the release reference Mac. Keep every
          # timing result, including misses; only timing is observation-only here.
          # Explicit bash retains pipefail so tee cannot hide functional failures.
          node tools/acceptance/capture.cjs --capture-runs=200 --cancel-runs=200 --observe-timing | tee release/capture-observation.json
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('release/capture-observation.json', 'utf8'));
          if (report.functionalStatus !== 'passed') throw new Error('Capture workflows failed.');
          const gate = report.gateChecks.reviewAndExplicitCopyProcessingP95;
          const message = `Hosted software p95: ${gate.observedMs} ms; target ${gate.targetMs} ms; observed pass: ${gate.passed}. Reference-Mac performance acceptance remains open.`;
          console.log(`::${gate.passed === true ? 'notice' : 'warning'}::${message}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n${message}\nRaw results are retained in capture-observation.json.\n`);
          NODE
      - name: Archive verified macOS test candidate (not a release)
        if: runner.os == 'macOS' && (github.event_name == 'push' || startsWith(github.head_ref, 'release/'))
        env:
          SCREENFLING_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node tools/acceptance/archive-macos.cjs
          cp release/capture-observation.json release/candidate/capture-observation.json
          cp release/agent-observation.json release/candidate/agent-observation.json
          (cd release/candidate && shasum -a 256 capture-observation.json agent-observation.json >> SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'macOS' && (github.event_name == 'push' || startsWith(github.head_ref, 'release/'))
        with:
          name: screenfling-macos-${{ runner.arch }}-${{ github.sha }}
          path: release/candidate/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
