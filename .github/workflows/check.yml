name: Check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: Check on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev libdecor-0-dev libpipewire-0.3-dev libclang-dev libdbus-1-dev xvfb xdotool xclip
      - name: Test and build
        shell: bash
        run: |
          mkdir -p dist
          cargo test --release --all-targets --quiet
          cargo build --release --quiet
      - name: Collect native build
        shell: bash
        run: |
          cp Cargo.lock dist/
          cargo tree --edges normal --color never > dist/dependencies.txt
          if [ -f target/release/screenfling.exe ]; then cp target/release/screenfling.exe dist/; else cp target/release/screenfling dist/; fi
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: screenfling-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
