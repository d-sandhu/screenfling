name: Check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: Check on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri libdrm-dev libgbm-dev libdecor-0-dev libpipewire-0.3-dev libclang-dev libdbus-1-dev xvfb xdotool xclip x11-xserver-utils
      - name: Test and build
        shell: bash
        run: |
          mkdir -p dist
          cargo fmt --all --check
          cargo test --release --locked --all-targets --quiet
          cargo build --release --locked --quiet
      - name: Native desktop smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x800x24 -noreset' python3 scripts/smoke-x11.py
      - name: One-off readiness diagnostics
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git archive --format=tar.gz HEAD > dist/source.tar.gz
          cp "$(rustup which rustfmt)" dist/rustfmt
          ldd dist/rustfmt > dist/rustfmt-libraries.txt
          cargo clippy --release --locked --all-targets > dist/clippy.txt 2>&1
          cargo install cargo-audit --locked --quiet
          cargo audit --json > dist/dependency-audit.json
      - name: Package and record build evidence
        shell: bash
        run: |
          python3 scripts/package.py
          cp Cargo.lock dist/
          cargo tree --locked --edges normal --color never > dist/dependencies.txt
          ls -lh dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenfling-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
