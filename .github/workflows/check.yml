name: Check
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    # Same-repository branches are checked on push; fork contributions on PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Check on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri libdrm-dev libgbm-dev libdecor-0-dev libpipewire-0.3-dev libclang-dev libdbus-1-dev xvfb xdotool xclip x11-xserver-utils
      - name: Test and build
        shell: bash
        run: |
          mkdir -p dist
          cargo fmt --all --check
          cargo clippy --release --locked --all-targets -- -D warnings
          cargo test --release --locked --all-targets --quiet
          cargo build --release --locked --quiet
          python3 scripts/check-cli.py
      - name: Native desktop smoke
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24 -noreset' python3 scripts/smoke-x11.py
          docker run --rm -v "$PWD:/workspace:ro" -v "$PWD/dist:/workspace/dist" \
            -w /workspace -e HOST_UID="$(id -u)" ubuntu:26.04 bash -eu -c '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                python3 sway swaybg pipewire wireplumber xdg-desktop-portal \
                xdg-desktop-portal-wlr wtype wl-clipboard dbus-daemon libglib2.0-bin \
                libgl1 libegl1 libgl1-mesa-dri libwayland-egl1 libwayland-cursor0 libdecor-0-0 \
                libx11-6 libxrandr2 libxfixes3 libxi6 libxss1 libxtst6
              useradd --no-create-home --uid "$HOST_UID" sf-check
              dpkg-query -W sway xdg-desktop-portal-wlr pipewire
              runuser -u sf-check -- python3 scripts/smoke-wayland.py
            '
      - name: Package and record build evidence
        shell: bash
        run: |
          python3 scripts/package.py
          cp Cargo.lock dist/
          cargo tree --locked --edges normal --color never > dist/dependencies.txt
          ls -lh dist
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('dist/**') != '' }}
        with:
          name: screenfling-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
