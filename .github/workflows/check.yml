name: Check
on:
  push:
    branches: [main, rust-egui-rewrite-2026-09-20]
  pull_request:
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'pull_request' || github.head_ref != 'rust-egui-rewrite-2026-09-20'
    name: Check on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri libdrm-dev libgbm-dev libdecor-0-dev libpipewire-0.3-dev libclang-dev libdbus-1-dev xvfb xdotool xclip x11-xserver-utils
      - name: Test and build
        shell: bash
        run: |
          mkdir -p dist
          cargo fmt --all
          git diff -- src > dist/rustfmt.patch
          cargo clippy --release --locked --all-targets -- -D warnings
          cargo test --release --locked --all-targets --quiet
          cargo build --release --locked --quiet
          python3 scripts/check-cli.py
          if [ "$RUNNER_OS" = Linux ]; then
            tar -czf dist/source.tar.gz --exclude=dist --exclude=target --exclude=.git .
            sed -i '/let stride = chunk.stride;/a\            eprintln!("Plane type={} flags={} fd={} map={} max={} off={} size={} stride={}", data.as_raw().type_, data.as_raw().flags, data.as_raw().fd, data.as_raw().mapoffset, data.as_raw().maxsize, chunk.offset, chunk.size, chunk.stride);' src/capture/wayland.rs
            sed -i '/let _ = stream.disconnect();/i\    eprintln!("Capture error: {:?}", value.as_ref().err());' src/capture/wayland.rs
            CARGO_PROFILE_RELEASE_DEBUG=1 CARGO_PROFILE_RELEASE_STRIP=none cargo build --release --locked --quiet
            cp target/release/screenfling dist/diagnostic-linux
            sed -i 's/thread apply all bt/bt full/; s/\[-6000:\]/[-32000:]/' scripts/smoke-wayland.py
          fi
      - name: One-off native clipboard check
        if: runner.os != 'Linux'
        shell: bash
        run: python3 scripts/check-native-clipboard.py
      - name: One-off native routing check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          package=wezterm-20240203-110809-5046fc22.Ubuntu22.04.deb
          url=https://github.com/wezterm/wezterm/releases/download/20240203-110809-5046fc22
          curl -fsSL "$url/$package" -o "$package"
          curl -fsSL "$url/$package.sha256" -o package.sha256
          printf '%s  %s\n' "$(cut -d ' ' -f 1 package.sha256)" "$package" | sha256sum --check -
          sudo apt-get install -y "./$package"
          cd "$GITHUB_WORKSPACE"
          python3 scripts/smoke-wezterm.py
      - name: Native desktop smoke
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24 -noreset' python3 scripts/smoke-x11.py
          docker run --rm --cap-add=SYS_PTRACE -v "$PWD:/workspace:ro" -v "$PWD/dist:/workspace/dist" \
            -w /workspace -e HOST_UID="$(id -u)" ubuntu:26.04 bash -eu -c '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                python3 sway swaybg pipewire wireplumber xdg-desktop-portal gdb \
                xdg-desktop-portal-wlr wtype wl-clipboard dbus-daemon libglib2.0-bin \
                libgl1 libegl1 libgl1-mesa-dri libwayland-egl1 libwayland-cursor0 libdecor-0-0 \
                libx11-6 libxrandr2 libxfixes3 libxi6 libxss1 libxtst6
              useradd --no-create-home --uid "$HOST_UID" sf-check
              dpkg-query -W sway xdg-desktop-portal-wlr pipewire
              runuser -u sf-check -- python3 scripts/smoke-wayland.py
            '
      - name: Package and record build evidence
        shell: bash
        run: |
          python3 scripts/package.py
          cp Cargo.lock dist/
          cargo tree --locked --edges normal --color never > dist/dependencies.txt
          ls -lh dist
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('dist/**') != '' }}
        with:
          name: screenfling-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
