# Temporary rewrite maintenance; removed after its source commit.
name: Prepare native sources
on:
  push:
    branches: [rust-egui-rewrite-2026-09-20]
    paths: [.github/workflows/prepare-native.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Finish native path and window handling
        shell: python
        run: |
          from pathlib import Path
          import re
          def replace(path, before, after):
              p = Path(path)
              text = p.read_text()
              assert text.count(before) == 1, (path, before)
              p.write_text(text.replace(before, after))
          replace('src/trusted.rs', 'if metadata.mode() & 0o022 != 0 && !sticky_root {', '''// macOS application directories can be writable by administrators.
                  // This trusts the same privileged users as Windows, not other users.
                  let administrator_install = cfg!(target_os = "macos")
                      && matches!(kind, Kind::Executable | Kind::Parent)
                      && matches!(metadata.gid(), 0 | 80);
                  let unsafe_write = metadata.mode() & 0o002 != 0
                      || (metadata.mode() & 0o020 != 0 && !administrator_install);
                  if unsafe_write && !sticky_root {''')
          replace('src/trusted.rs', 'metadata.uid() as u64,\n            metadata.mode()', 'metadata.uid() as u64,\n            metadata.gid() as u64,\n            metadata.mode()')
          p = Path('src/trusted_windows.rs')
          text = p.read_text()
          text, count = re.subn(r'const MUTATE: u32\s*=.*?;', '''// Creating an unrelated sibling in an ancestor (for example C:\\) is
              // not replacement of an existing checked path. Delete-child is.
              let ancestor = !require_user_owner && std::fs::symlink_metadata(path)
                  .is_ok_and(|metadata| metadata.is_dir());
              let mutate = if ancestor {
                  0x1000_0000 | 0x0001_0000 | 0x0004_0000 | 0x0008_0000 | 0x40
              } else {
                  0x4000_0000 | 0x1000_0000 | 0x0001_0000 | 0x0004_0000 | 0x0008_0000 | 0x156
              };''', text, count=1, flags=re.S)
          assert count == 1
          p.write_text(text.replace('allow.Mask & MUTATE', 'allow.Mask & mutate'))
          p = Path('src/trusted.rs')
          with p.open('a') as f:
              f.write(r'''
          #[cfg(test)]
          mod tests {
              use super::*;
              #[test]
              fn local_endpoint_is_pinned_and_replacement_is_rejected() {
                  use socket2::{Domain, SockAddr, Socket, Type};
                  let directory = TemporaryDirectory::new().unwrap();
                  let path = directory.0.join("s");
                  let listener = Socket::new(Domain::UNIX, Type::STREAM, None).unwrap();
                  listener.bind(&SockAddr::unix(&path).unwrap()).unwrap();
                  listener.listen(1).unwrap();
                  #[cfg(unix)] {
                      use std::os::unix::fs::PermissionsExt;
                      fs::set_permissions(&path, fs::Permissions::from_mode(0o600)).unwrap();
                  }
                  let executable = std::env::current_exe().unwrap();
                  let connection = Connection::inspect(executable.to_str().unwrap(), path.to_str().unwrap()).unwrap();
                  connection.unchanged().unwrap();
                  let client = crate::relay::connect(&connection.socket).unwrap();
                  drop(client);
                  drop(listener);
                  fs::remove_file(&path).unwrap();
                  fs::write(&path, b"not a socket").unwrap();
                  assert!(connection.unchanged().is_err());
              }
          }
          ''')
          replace('src/capture/windows.rs', 'let image = monitor.capture_image().map_err(message)?;', '''if bounds[2] <= 0 || bounds[3] <= 0
                  || (bounds[2] as usize).checked_mul(bounds[3] as usize)
                      .and_then(|n| n.checked_mul(4)).is_none_or(|n| n > crate::model::MAX_IMAGE_BYTES) {
                  return Err("This display is too large to capture safely.".into());
              }
              let image = monitor.capture_image().map_err(message)?;''')
          replace('src/main.rs', 'let _gl = window.gl_create_context()', 'unsafe { sdl3_sys::video::SDL_SetWindowMinimumSize(window.raw(), 640, 480); }\n    let _gl = window.gl_create_context()')
      - name: Format and commit
        run: |
          cargo fmt --all
          git add src
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Support normal native installation paths without weakening endpoint identity'
          git push origin HEAD:refs/heads/rust-egui-rewrite-2026-09-20
