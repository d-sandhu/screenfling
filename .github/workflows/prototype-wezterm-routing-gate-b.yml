name: Prototype WezTerm routing Gate B

on:
  workflow_dispatch:
  push:
    branches:
      - prototype/wezterm-routing-gate-b

permissions:
  contents: read

jobs:
  windows-routing-primitive:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - run: npm run prototype:routing
