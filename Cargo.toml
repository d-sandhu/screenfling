[package]
name = "screenfling"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Select part of the screen, then copy it or send it straight to your coding agent."
repository = "https://github.com/d-sandhu/screenfling"
readme = "README.md"
publish = false

[dependencies]
# Windows and input, drawn on the CPU: no GPU, no GUI toolkit, no C build.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
raw-window-handle = "0.6"
fontdue = "0.9.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
global-hotkey = "0.8"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView", "NSWindow", "NSScreen", "NSGraphics"] }
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSGeometry"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCShareableContent", "SCStream", "SCScreenshotManager", "block2", "objc2-core-graphics", "objc2-core-foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
xcap = { version = "0.9.8", default-features = false }
# COM interfaces for UI Automation (Windows Terminal tabs); already used by xcap.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Registry"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
x11rb = { version = "0.13", features = ["randr", "xtest"] }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screencast", "global_shortcuts"] }
pipewire = "0.10"
async-io = "2"
futures-lite = "2"
async-channel = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 1
