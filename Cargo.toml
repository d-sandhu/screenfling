[package]
name = "screenfling"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Capture, review, and stage a screenshot in an exact coding session."
repository = "https://github.com/d-sandhu/screenfling"

[dependencies]
egui-sdl3 = { version = "=0.4.0", default-features = false, features = ["glow-backend"] }
sdl3 = { version = "0.18.4", default-features = false, features = ["build-from-source", "static-link"] }
sdl3-sys = { version = "0.6.6", default-features = false, features = ["no-default-subsystems", "sdl-video", "sdl-tray"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
global-hotkey = "0.8"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = { version = "0.9.8", default-features = false }
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screencast", "global_shortcuts"] }
pipewire = "0.10"
async-io = "2"
futures-lite = "2"
async-channel = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 1
